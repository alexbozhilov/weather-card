<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — Albany Park, Chicago</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0c4a6e 100%);
    color: #e2e8f0;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .card {
    background: rgba(30, 41, 59, 0.75);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    border: 1px solid rgba(148, 163, 184, 0.12);
    padding: 32px;
    max-width: 680px;
    width: 100%;
    box-shadow: 0 25px 60px -12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .header { text-align: center; margin-bottom: 24px; position: relative; }
  .header h1 { font-size: 22px; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
  .header .date { font-size: 13px; color: #94a3b8; }

  /* Animated sun/cloud icon */
  .weather-icon-wrap {
    width: 100%; height: 120px; margin-bottom: 16px; display: flex; justify-content: center; align-items: center;
    position: relative;
    overflow: hidden;
  }

  .weather-label {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: #e2e8f0; font-weight: 600; text-align: right;
    max-width: 45%; padding-left: 12px;
    white-space: normal; word-wrap: break-word;
    line-height: 1.3;
  }

  .weather-label .main-line { font-size: 16px; color: #e2e8f0; }
  .weather-label .sub-line { font-size: 13px; color: #94a3b8; margin-top: 2px; }

  .current {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    padding: 28px; background: rgba(51, 65, 85, 0.35); border-radius: 16px;
    margin-bottom: 24px; border: 1px solid rgba(148,163,184,0.08);
  }
  .current .temp-big { font-size: 56px; font-weight: 700; background: linear-gradient(135deg, #fbbf24, #fb923c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .current .condition { font-size: 16px; color: #cbd5e1; margin-top: 4px; }
  .current .feels { font-size: 13px; color: #64748b; margin-top: 2px; }

  /* Circular progress metrics */
  .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 28px; }
  .metric {
    background: rgba(51, 65, 85, 0.3); border-radius: 14px; padding: 16px 10px; text-align: center;
    border: 1px solid rgba(148, 163, 184, 0.06); transition: transform 0.2s, border-color 0.2s;
    cursor: default;
  }
  .metric:hover { transform: translateY(-2px); border-color: rgba(148,163,184,0.2); }
  .metric .icon { font-size: 22px; margin-bottom: 6px; }
  .metric .val { font-size: 17px; font-weight: 700; color: #f1f5f9; }
  .metric .lbl { font-size: 11px; color: #64748b; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* AQI badge */
  .aqi-badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-top: 4px; color: #fff;
  }

  /* Circular SVG progress */
  .circular-progress { width: 52px; height: 52px; margin: 0 auto 8px; }
  .circular-progress circle { fill: none; stroke-width: 4; transform: rotate(-90deg); transform-origin: center; }
  .circular-progress .bg { stroke: rgba(100,116,139,0.2); }
  .circular-progress .fg { stroke-linecap: round; transition: stroke-dashoffset 1s ease; }

  .forecast-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: #94a3b8; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  .forecast-title::after { content:''; flex:1; height:1px; background:rgba(148,163,184,0.15); }

  /* Bar chart */
  .chart-wrap { margin-bottom: 20px; }
  svg.forecast-chart { width: 100%; height: auto; }

  .footnotes { display: flex; justify-content: space-between; font-size: 11px; color: #64748b; padding-top: 12px; border-top: 1px solid rgba(148,163,184,0.08); }

  /* Loading state */
  .loading { text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 15px; }
  .loading .spinner { width: 36px; height: 36px; border: 3px solid rgba(148,163,184,0.2); border-top-color: #fbbf24; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error state */
  .error-msg { text-align: center; padding: 40px; color: #ef4444; font-size: 14px; }

  /* Responsive breakpoints */
  @media (max-width: 720px) {
    body { padding: 12px; }
    .card { padding: 20px; border-radius: 18px; }
    .metrics { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .current { padding: 20px; gap: 16px; flex-wrap: wrap; }
    .current .temp-big { font-size: 44px; }
    .header h1 { font-size: 18px; }
    svg.forecast-chart { height: auto; }
  }

  @media (max-width: 480px) {
    body { padding: 8px; }
    .card { padding: 16px; border-radius: 14px; }
    .metrics { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .metric { padding: 12px 6px; }
    .metric .val { font-size: 15px; }
    .current { padding: 16px; gap: 10px; }
    .current .temp-big { font-size: 36px; }
    .header h1 { font-size: 16px; }
    .weather-icon-wrap { height: 90px; }
    .weather-label { font-size: 13px; max-width: 50%; }
    .weather-label .main-line { font-size: 13px; }
    .weather-label .sub-line { font-size: 11px; }
    svg.forecast-chart { width: 100%; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    Fetching weather data…
  </div>

  <div id="weatherContent" style="display:none;">
    <div class="header">
      <h1>📍 Albany Park, Chicago</h1>
      <div class="date" id="timestamp"></div>
    </div>

    <!-- Animated SVG weather icon -->
    <div class="weather-icon-wrap" id="weatherIconWrap">
      <!-- Filled by JS -->
    </div>

    <!-- Current conditions -->
    <div class="current">
      <div style="text-align:center">
        <div class="temp-big" id="tempDisplay"></div>
        <div class="condition" id="conditionDisplay"></div>
        <div class="feels" id="feelsDisplay"></div>
      </div>
    </div>

    <!-- Metric cards with circular progress -->
    <div class="metrics" id="metricsGrid"></div>

    <!-- Temperature bar chart -->
    <div class="forecast-title">3-Day Temperature Forecast (°C / °F)</div>
    <svg class="forecast-chart" viewBox="0 0 616 240" fill="none" xmlns="http://www.w3.org/2000/svg" id="chartSvg"></svg>

    <div class="footnotes" id="footnotes">
      <!-- Filled by JS -->
    </div>
  </div>

  <div class="error-msg" id="errorMsg" style="display:none;">
    Failed to load weather data. Please try refreshing the page.
  </div>
</div>

<script>
// ─── Weather Code to Description + Icon ───
function getWeatherInfo(code, isDay) {
  const codes = {
    0: { desc: "Clear sky", icon: isDay ? "☀️" : "🌙" },
    1: { desc: "Mainly clear", icon: isDay ? "🌤️" : "🌙" },
    2: { desc: "Partly cloudy", icon: isDay ? "⛅" : "☁️" },
    3: { desc: "Overcast", icon: "☁️" },
    45: { desc: "Foggy", icon: "🌫️" },
    48: { desc: "Icy fog", icon: "🌫️" },
    51: { desc: "Light drizzle", icon: "🌦️" },
    53: { desc: "Drizzle", icon: "🌦️" },
    55: { desc: "Heavy drizzle", icon: "🌧️" },
    61: { desc: "Light rain", icon: "🌧️" },
    63: { desc: "Rain", icon: "🌧️" },
    65: { desc: "Heavy rain", icon: "🌧️" },
    71: { desc: "Light snow", icon: "🌨️" },
    73: { desc: "Snow", icon: "❄️" },
    75: { desc: "Heavy snow", icon: "❄️" },
    80: { desc: "Rain showers", icon: "🌦️" },
    81: { desc: "Moderate showers", icon: "🌧️" },
    82: { desc: "Heavy showers", icon: "⛈️" },
    95: { desc: "Thunderstorm", icon: "⛈️" },
    96: { desc: "Thunderstorm with hail", icon: "⛈️" },
    99: { desc: "Thunderstorm with heavy hail", icon: "⛈️" }
  };
  return codes[code] || { desc: "Unknown", icon: "🌡️" };
}

// ─── UV Index Color & Label ───
function uvInfo(uv) {
  if (uv <= 2) return { color: "#22c55e", label: "Low" };
  if (uv <= 5) return { color: "#eab308", label: "Moderate" };
  if (uv <= 7) return { color: "#f97316", label: "High" };
  if (uv <= 10) return { color: "#ef4444", label: "Very High" };
  return { color: "#a855f7", label: "Extreme" };
}

// ─── AQI Color & Label ───
function aqiInfo(aqi) {
  if (aqi <= 50) return { color: "#22c55e", label: "Good" };
  if (aqi <= 100) return { color: "#eab308", label: "Moderate" };
  if (aqi <= 150) return { color: "#f97316", label: "Unhealthy (Sensitive)" };
  if (aqi <= 200) return { color: "#ef4444", label: "Unhealthy" };
  if (aqi <= 300) return { color: "#8b5cf6", label: "Very Unhealthy" };
  return { color: "#7f1d1d", label: "Hazardous" };
}

// ─── SVG Weather Icon ───
function renderWeatherIcon(code, isDay) {
  const info = getWeatherInfo(code, isDay);
  const wrap = document.getElementById('weatherIconWrap');
  
  const sunRays = Array.from({length: 8}, (_, i) => {
    const angle = (i * 45) * Math.PI / 180;
    const x1 = 85 + Math.cos(angle) * 28;
    const y1 = 65 + Math.sin(angle) * 28;
    const x2 = 85 + Math.cos(angle) * 36;
    const y2 = 65 + Math.sin(angle) * 36;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>`;
  }).join('');

  const cloudOpacity = code <= 3 ? "0.85" : "0.95";
  const cloudColor = code <= 3 ? "#cbd5e1" : (code >= 61 ? "#7c8fa3" : "#94a3b8");

  let extraElements = '';
  if (code >= 61 && code < 80) {
    for (let i = 0; i < 5; i++) {
      const x = 150 + i * 20;
      const y = 90 + Math.random() * 15;
      extraElements += `<line x1="${x}" y1="${y}" x2="${x-3}" y2="${y+8}" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>`;
    }
  } else if (code >= 95) {
    extraElements = `<polygon points="175,75 183,75 178,85 186,85 174,100 179,90 171,90" fill="#fbbf24"/>`;
  } else if (code >= 71) {
    for (let i = 0; i < 6; i++) {
      const x = 145 + i * 18;
      const y = 85 + Math.random() * 20;
      extraElements += `<circle cx="${x}" cy="${y}" r="2" fill="white" opacity="0.8"/>`;
    }
  }

      <svg viewBox="0 0 240 120" width="100%" height="120" fill="none">
        ${isDay && code <= 3 ? `<g style="transform-origin:85px 65px;animation:spin 20s linear infinite;">${sunRays}</g>` : ''}
        <circle cx="85" cy="65" r="22" fill="#fbbf24"/>
        ${isDay && code <= 3 ? `<circle cx="85" cy="65" r="28" stroke="#fbbf24" stroke-width="1.5" opacity="0.3"/>` : ''}
        <ellipse cx="150" cy="70" rx="45" ry="22" fill="${cloudColor}" opacity="${cloudOpacity}"/>
        <ellipse cx="125" cy="62" rx="28" ry="18" fill="${cloudColor}"/>
        <ellipse cx="170" cy="60" rx="24" ry="16" fill="${cloudColor}"/>
        <ellipse cx="150" cy="63" rx="30" ry="18" fill="${code <= 3 ? '#d1d5db' : cloudColor}"/>
        ${extraElements}
        <style>@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}</style>
      </svg>
      <div class="weather-label">
        <span class="main-line">${info.icon} ${info.desc.split(' ')[0]}</span><br/>
        <span class="sub-line">${info.desc.split(' ').slice(1).join(' ')}</span>
      </div>`;
}

// ─── Render Metrics ───
function renderMetrics(data) {
  const circumference = 2 * Math.PI * 22;

  // AQI badge HTML if available
  let aqiHtml = '';
  if (data.aqi !== null && data.aqi !== undefined) {
    const aqiInfoObj = aqiInfo(data.aqi);
    aqiHtml = `<span class="aqi-badge" style="background:${aqiInfoObj.color}">${aqiInfoObj.label}</span>`;
  }

  // UV badge HTML if available
  let uvHtml = '';
  if (data.uvIndex !== null && data.uvIndex !== undefined) {
    const uvInfoObj = uvInfo(data.uvIndex);
    uvHtml = `<span class="aqi-badge" style="background:${uvInfoObj.color}">${uvInfoObj.label}</span>`;
  }

  const metrics = [
    { icon: "🌡️", label: "UV Index", val: data.uvIndex !== null && data.uvIndex !== undefined ? `${data.uvIndex.toFixed(1)}` : "N/A", pct: Math.min((data.uvIndex || 0) * 10, 100), color: data.uvInfoObj?.color || "#64748b" },
    { icon: "🫁", label: "Air Quality", val: data.aqi !== null && data.aqi !== undefined ? `AQI ${data.aqi}` : "N/A", pct: Math.min(((data.aqi || 0) / 301) * 100, 100), color: data.aqiInfoObj?.color || "#64748b" },
    { icon: "💧", label: "Humidity", val: `${data.humidity}%`, pct: data.humidity, color: "#f97316" },
    { icon: "💨", label: `Wind ${data.windDir}`, val: `${data.windMph} mph`, pct: Math.min(data.windMph * 10, 100), color: "#38bdf8" },
    { icon: "☁️", label: "Cloud Cover", val: `${data.cloudCover}%`, pct: data.cloudCover, color: "#a78bfa" }
  ];

  const metricsGrid = document.getElementById('metricsGrid');
  
  // Recalculate percentiles for AQI (0-300 scale) and UV (0-11 scale)
  const adjustedMetrics = metrics.map(m => {
    if (m.label === "UV Index") m.pct = Math.min(((data.uvIndex || 0) / 11) * 100, 100);
    if (m.label === "Air Quality") m.pct = Math.min(((data.aqi || 0) / 301) * 100, 100);
    return m;
  });

  metricsGrid.innerHTML = adjustedMetrics.map(m => {
    const offset = circumference - (m.pct / 100) * circumference;
    return `
      <div class="metric">
        <svg class="circular-progress" viewBox="0 0 52 52">
          <circle class="bg" cx="26" cy="26" r="22"/>
          <circle class="fg" cx="26" cy="26" r="22" stroke="${m.color}" stroke-dasharray="${circumference.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"/>
        </svg>
        <div class="icon">${m.icon}</div>
        <div class="val">${m.val}</div>
        ${m.label === "Air Quality" && aqiHtml ? `<div style="margin:4px 0;">${aqiHtml}</div>` : ''}
        ${m.label === "UV Index" && uvHtml ? `<div style="margin:4px 0;">${uvHtml}</div>` : ''}
        <div class="lbl">${m.label}</div>
      </div>`;
  }).join('');
}

// ─── Render Chart ───
function renderChart(forecast) {
  const baseChart = `
    <line x1="55" y1="30" x2="600" y2="30" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="55" y1="70" x2="600" y2="70" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="55" y1="110" x2="600" y2="110" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="55" y1="150" x2="600" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="55" y1="190" x2="600" y2="190" stroke="#334155" stroke-width="1"/>
    <text x="45" y="34" font-size="10" fill="#64748b" text-anchor="end">20°</text>
    <text x="45" y="74" font-size="10" fill="#64748b" text-anchor="end">15°</text>
    <text x="45" y="114" font-size="10" fill="#64748b" text-anchor="end">10°</text>
    <text x="45" y="154" font-size="10" fill="#64748b" text-anchor="end">5°</text>
    <text x="45" y="194" font-size="10" fill="#64748b" text-anchor="end">0°</text>`;

  const defs = `
    <defs>
      <linearGradient id="highGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#f97316"/>
      </linearGradient>
      <linearGradient id="lowGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#3b82f6"/>
      </linearGradient>
    </defs>`;

  const barWidth = 38;
  const positions = [90, 272, 454];
  
  let barsHtml = forecast.map((d, i) => {
    const x = positions[i];
    const highY = 30 + (20 - d.highC) * 8;
    const lowY = 30 + (20 - d.lowC) * 8;
    const highH = 190 - highY;
    const lowH = 190 - lowY;

    return `
      <rect x="${x}" y="${highY}" width="${barWidth}" height="${highH}" rx="5" fill="url(#highGrad)" opacity="0.85"/>
      <text x="${x + barWidth/2}" y="${Math.min(highY + 14, 60)}" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="700">${d.highC}°</text>
      <text x="${x + barWidth/2}" y="${Math.min(highY + 28, 74)}" font-size="9" fill="#fb923c" text-anchor="middle">${d.highF}°F</text>
      <rect x="${x + barWidth + 10}" y="${lowY}" width="${barWidth}" height="${lowH}" rx="5" fill="url(#lowGrad)" opacity="0.85"/>
      <text x="${x + barWidth*2 + 10}" y="${Math.min(lowY + lowH/2 + 4, 160)}" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="700">${d.lowC}°</text>
      <text x="${x + barWidth*2 + 10}" y="${Math.min(lowY + lowH/2 + 18, 174)}" font-size="9" fill="#60a5fa" text-anchor="middle">${d.lowF}°F</text>
      <text x="${x + barWidth*2 + 5}" y="215" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="600">${d.day}</text>`;
  }).join('');

  document.getElementById('chartSvg').innerHTML = baseChart + barsHtml + defs;
}

// ─── Wind Direction Abbreviation ───
function windDir(deg) {
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(deg / 45) % 8];
}

// ─── Main Fetch & Render ───
async function fetchWeather() {
  try {
    // Primary weather API with UV index included
    const weatherUrl = 'https://api.open-meteo.com/v1/forecast?' + 
      'latitude=41.98' +
      '&longitude=-87.66' +
      '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,cloud_cover,precipitation,pressure_msl,is_day,uv_index' +
      '&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset' +
      '&timezone=America%2FChicago' +
      '&forecast_days=3';

    // Air quality API (separate endpoint)
    const aqiUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?' + 
      'latitude=41.98' +
      '&longitude=-87.66' +
      '&current=us_aqi,pm2_5' +
      '&timezone=America%2FChicago';

    const [weatherRes, aqiRes] = await Promise.all([fetch(weatherUrl), fetch(aqiUrl)]);
    
    if (!weatherRes.ok) throw new Error(`Weather API error: ${weatherRes.status}`);
    
    const weatherData = await weatherRes.json();
    let aqiData = null;
    try {
      if (aqiRes.ok) aqiData = await aqiRes.json();
    } catch (e) { /* air quality may fail gracefully */ }

    // Process current weather
    const current = weatherData.current;
    const info = getWeatherInfo(current.weather_code, current.is_day === 1);
    
    // UV index color/label
    const uvInfoObj = current.uv_index !== null ? uvInfo(current.uv_index) : null;

    // Format timestamp
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' };
    const timestampStr = now.toLocaleDateString('en-US', options);

    // Process forecast
    const daily = weatherData.daily;
    const forecast = [];
    for (let i = 0; i < Math.min(3, daily.time.length); i++) {
      const date = new Date(daily.time[i] + 'T12:00:00');
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const dayName = i === 0 ? 'Today' : dayNames[date.getDay()];
      const monthDay = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      
      forecast.push({
        day: `${dayName} ${monthDay}`,
        date: monthDay,
        highC: Math.round(daily.temperature_2m_max[i]),
        lowC: Math.round(daily.temperature_2m_min[i]),
        highF: Math.round(daily.temperature_2m_max[i] * 9/5 + 32),
        lowF: Math.round(daily.temperature_2m_min[i] * 9/5 + 32),
        icon: info.icon,
      });
    }

    // Convert wind speed from m/s to mph
    const windMph = (current.wind_speed_10m / 1.609).toFixed(0);

    // Get AQI value
    let aqi = null;
    if (aqiData && aqiData.current) {
      aqi = aqiData.current.us_aqi !== undefined ? Math.round(aqiData.current.us_aqi) : null;
    }

    const aqiInfoObj = aqi !== null ? aqiInfo(aqi) : null;

    // Update UI
    document.getElementById('timestamp').textContent = timestampStr;
    document.getElementById('tempDisplay').textContent = `${Math.round(current.temperature_2m)}° / ${Math.round(current.temperature_2m * 9/5 + 32)}°`;
    document.getElementById('conditionDisplay').textContent = info.desc;
    document.getElementById('feelsDisplay').textContent = `Feels like ${Math.round(current.apparent_temperature)}°C / ${Math.round(current.apparent_temperature * 9/5 + 32)}°F`;

    // Render dynamic icon
    renderWeatherIcon(current.weather_code, current.is_day === 1);

    // Render metrics (UV, AQI, Humidity, Wind, Cloud)
    renderMetrics({
      uvIndex: current.uv_index,
      uvInfoObj,
      aqi: aqi,
      aqiInfoObj,
      humidity: current.relative_humidity_2m,
      windMph: parseInt(windMph),
      windDir: windDir(current.wind_direction_10m),
      cloudCover: current.cloud_cover
    });

    // Render chart
    renderChart(forecast);

    // Update footnotes with sunrise/sunset for today
    const sunriseStr = daily.sunrise[0] ? new Date(daily.sunrise[0]).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '--';
    const sunsetStr = daily.sunset[0] ? new Date(daily.sunset[0]).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '--';
    
    let lowTemp = Infinity, highTemp = -Infinity;
    forecast.forEach(f => {
      if (f.lowC < lowTemp) lowTemp = f.lowC;
      if (f.highC > highTemp) highTemp = f.highC;
    });

    document.getElementById('footnotes').innerHTML = `
      <span>Sunrise ${sunriseStr} · Sunset ${sunsetStr}</span>
      <span style="color:#64748b;">Range: ${lowTemp}°–${highTemp}° (${Math.round(lowTemp*9/5+32)}°F–${Math.round(highTemp*9/5+32)}°F)</span>
      <span>CST (UTC-6)</span>`;

    // Show content, hide loading
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('weatherContent').style.display = 'block';

  } catch (err) {
    console.error('Weather fetch error:', err);
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'block';
  }
}

// ─── Auto-refresh every 10 minutes ───
fetchWeather();
setInterval(fetchWeather, 10 * 60 * 1000); // 10 minutes
</script>
